<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Saved Posts | Boostly</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #172033;
    }

    header {
      background: #ffffff;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px #0000000d;
      position: sticky;
      top: 0;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      color: #5b4bff;
    }

    header a {
      text-decoration: none;
      color: #5b4bff;
      font-weight: bold;
    }

    main {
      max-width: 850px;
      margin: 25px auto;
      padding: 0 14px;
    }

    h1 {
      margin-bottom: 6px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 22px;
    }

    #status {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 18px;
      overflow-wrap: anywhere;
    }

    .post {
      background: white;
      border-radius: 15px;
      margin-bottom: 22px;
      overflow: hidden;
      box-shadow: 0 4px 18px #0000000b;
    }

    .post-info {
      padding: 16px;
    }

    .business {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .caption {
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .media {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      display: block;
      background: #111;
    }

    .post-actions {
      padding: 0 16px 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .remove {
      background: #fff0f0;
      color: #c62828;
    }

    .view {
      background: #eeeaff;
      color: #5142df;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 35px 18px;
      border-radius: 15px;
    }

    .empty a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      background: #5b4bff;
      color: white;
      border-radius: 9px;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      main {
        margin-top: 18px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Boostly</div>
  <a href="boost-feed.html">← Boost Feed</a>
</header>

<main>
  <h1>🔖 Saved Posts</h1>
  <p class="subtitle">Your favourite posts, all in one place.</p>

  <div id="status">Loading your saved posts...</div>
  <div id="posts"></div>
</main>

<script>
  const statusBox = document.getElementById("status");
  const postsBox = document.getElementById("posts");

  async function loadSavedPosts() {
    statusBox.textContent = "Loading your saved posts...";
    postsBox.innerHTML = "";

    try {
      const response = await fetch("/api/boost-saved-posts", {
        method: "GET",
        credentials: "include",
        cache: "no-store"
      });

      const data = await response.json();

      if (response.status === 401) {
        statusBox.textContent = "Please login to view your saved posts.";
        return;
      }

      if (!response.ok || !data.success) {
        throw new Error(data.error || "Could not load saved posts.");
      }

      statusBox.textContent = "You have " + data.count + " saved post(s).";

      if (!data.posts || data.posts.length === 0) {
        postsBox.innerHTML = `
          <div class="empty">
            <h2>No saved posts yet</h2>
            <p>Visit Boost Feed and save a post to see it here.</p>
            <a href="boost-feed.html">Explore Boost Feed</a>
          </div>
        `;
        return;
      }

      data.posts.forEach(post => {
        const card = document.createElement("article");
        card.className = "post";
        card.dataset.postId = post.id;

        const info = document.createElement("div");
        info.className = "post-info";

        const business = document.createElement("div");
        business.className = "business";
        business.textContent = post.business_name || "Boostly Business";

        const caption = document.createElement("div");
        caption.className = "caption";
        caption.textContent = post.caption || "";

        info.appendChild(business);
        info.appendChild(caption);

        const mediaUrl = post.media_url || post.thumbnail_url || "";

        if (mediaUrl) {
          const isVideo =
            String(post.media_type || post.post_type || "")
              .toLowerCase()
              .includes("video") ||
            /\.(mp4|webm|mov)(\?.*)?$/i.test(mediaUrl);

          let media;

          if (isVideo) {
            media = document.createElement("video");
            media.controls = true;
            media.playsInline = true;
          } else {
            media = document.createElement("img");
            media.alt = "Saved post";
            media.loading = "lazy";
          }

          media.className = "media";
          media.src = mediaUrl;
          card.appendChild(info);
          card.appendChild(media);
        } else {
          card.appendChild(info);
        }

        const actions = document.createElement("div");
        actions.className = "post-actions";

        const removeButton = document.createElement("button");
        removeButton.className = "remove";
        removeButton.textContent = "Remove Saved";

        removeButton.addEventListener("click", async () => {
          const confirmed = confirm(
            "Remove this post from your saved posts?"
          );

          if (!confirmed) return;

          removeButton.disabled = true;
          removeButton.textContent = "Removing...";

          try {
            const removeResponse = await fetch("/api/boost-post-save", {
              method: "POST",
              credentials: "include",
              body: (() => {
                const form = new FormData();
                form.append("action", "unsave");
                form.append("post_id", String(post.id));
                return form;
              })()
            });

            const removeData = await removeResponse.json();

            if (!removeResponse.ok || !removeData.success) {
              throw new Error(
                removeData.error || "Could not remove saved post."
              );
            }

            card.remove();

            const remaining = postsBox.querySelectorAll(".post").length;
            statusBox.textContent =
              "You have " + remaining + " saved post(s).";

            if (remaining === 0) {
              postsBox.innerHTML = `
                <div class="empty">
                  <h2>No saved posts yet</h2>
                  <p>Visit Boost Feed and save a post to see it here.</p>
                  <a href="boost-feed.html">Explore Boost Feed</a>
                </div>
              `;
            }
          } catch (error) {
            alert(error.message);
            removeButton.disabled = false;
            removeButton.textContent = "Remove Saved";
          }
        });

        const viewButton = document.createElement("button");
        viewButton.className = "view";
        viewButton.textContent = "Open Boost Feed";
        viewButton.addEventListener("click", () => {
          window.location.href = "boost-feed.html";
        });

        actions.appendChild(removeButton);
        actions.appendChild(viewButton);
        card.appendChild(actions);
        postsBox.appendChild(card);
      });

    } catch (error) {
      statusBox.textContent =
        "Could not load saved posts. Please refresh and try again.";
      console.error(error);
    }
  }

  loadSavedPosts();
</script>

</body>
</html>
