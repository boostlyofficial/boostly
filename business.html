<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="description"
  content="View business details, services, offers, photos and contact information on Boostly."
>

<title>Business Profile | Boostly</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

img{
  max-width:100%;
  display:block;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid #e8ebf2;
  backdrop-filter:blur(12px);
}

.nav{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:26px;
  font-weight:800;
  color:#2563eb;
}

.logo span{
  color:#111827;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:22px;
}

.nav-links a{
  font-size:14px;
  font-weight:600;
  color:#4b5563;
}

.nav-links a:hover{
  color:#2563eb;
}

.nav-buttons{
  display:flex;
  align-items:center;
  gap:10px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-secondary{
  background:#eef4ff;
  color:#2563eb;
}

.btn-success{
  background:#16a34a;
  color:#fff;
}

.btn-dark{
  background:#111827;
  color:#fff;
}

.btn-outline{
  background:#fff;
  color:#2563eb;
  border:1px solid #dbe4f5;
}

.menu-btn{
  display:none;
  border:0;
  background:#eef4ff;
  color:#2563eb;
  padding:10px 12px;
  border-radius:10px;
  font-size:20px;
}

/* ================= PAGE ================= */

.page{
  padding:28px 0 70px;
}

.breadcrumb{
  font-size:13px;
  color:#6b7280;
  margin-bottom:18px;
}

.breadcrumb a{
  color:#2563eb;
}

/* ================= HERO ================= */

.hero{
  background:#fff;
  border:1px solid #e7ebf3;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 35px rgba(15,23,42,.06);
}

.hero-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
}

.hero-image{
  min-height:420px;
  position:relative;
  overflow:hidden;
  background:#e5e7eb;
}

.hero-image img{
  width:100%;
  height:100%;
  min-height:420px;
  object-fit:cover;
}

.verified{
  position:absolute;
  top:18px;
  left:18px;
  background:#16a34a;
  color:#fff;
  padding:8px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
}

.hero-content{
  padding:42px;
}

.category{
  color:#2563eb;
  font-weight:700;
  font-size:14px;
  margin-bottom:8px;
}

.hero-content h1{
  font-size:42px;
  line-height:1.12;
  margin-bottom:15px;
}

.rating{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
}

.stars{
  color:#f59e0b;
  font-size:19px;
  letter-spacing:1px;
}

.rating strong{
  font-size:17px;
}

.rating span{
  color:#6b7280;
  font-size:14px;
}

.hero-description{
  color:#5f6b7a;
  margin-bottom:22px;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.hero-tools{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

.status-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px;
}

.info-pill{
  background:#f4f7fb;
  border:1px solid #e6ebf3;
  border-radius:999px;
  padding:8px 12px;
  color:#536072;
  font-size:13px;
}

/* ================= SECTIONS ================= */

.section{
  margin-top:30px;
}

.section-title{
  margin-bottom:16px;
}

.section-title h2{
  font-size:28px;
  margin-bottom:4px;
}

.section-title p{
  color:#6b7280;
}

/* ================= CONTENT GRID ================= */

.content-grid{
  display:grid;
  grid-template-columns:1.65fr .75fr;
  gap:24px;
}

.card{
  background:#fff;
  border:1px solid #e7ebf3;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 25px rgba(15,23,42,.04);
}

.card h3{
  font-size:20px;
  margin-bottom:12px;
}

.muted{
  color:#6b7280;
}

/* ================= GALLERY ================= */

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.gallery-item{
  border:0;
  padding:0;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  background:#e5e7eb;
  aspect-ratio:1/1;
}

.gallery-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.3s;
}

.gallery-item:hover img{
  transform:scale(1.05);
}

/* ================= DYNAMIC MEDIA ================= */

.media-status{
  font-size:13px;
  color:#6b7280;
  margin-bottom:14px;
}

.dynamic-media{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.media-card{
  border:1px solid #e6ebf3;
  border-radius:16px;
  overflow:hidden;
  background:#fff;
}

.media-preview{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#eef1f6;
}

button.media-preview{
  border:0;
  padding:0;
  cursor:pointer;
}

.media-card video{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#111827;
}

.media-caption{
  padding:11px 12px;
  font-size:13px;
  color:#536072;
}

.media-loading{
  padding:25px;
  text-align:center;
  border:1px dashed #cfd7e5;
  border-radius:16px;
  color:#6b7280;
}

/* ================= SERVICES ================= */

.services{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.service{
  padding:18px;
  background:#f8faff;
  border:1px solid #e7edf8;
  border-radius:16px;
}

.service h4{
  margin-bottom:5px;
}

.service p{
  color:#6b7280;
  font-size:14px;
}

.price{
  color:#2563eb;
  font-weight:800;
  margin-top:8px;
}

/* ================= OFFERS ================= */

.offers{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.offer{
  border-radius:17px;
  padding:20px;
  background:#eff6ff;
  border:1px solid #dbeafe;
}

.offer strong{
  color:#1d4ed8;
  font-size:20px;
}

.offer p{
  color:#5f6b7a;
  margin-top:5px;
}

/* ================= SIDEBAR ================= */

.contact-list{
  display:grid;
  gap:14px;
}

.contact-item{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.contact-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#eef4ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.contact-item small{
  display:block;
  color:#8a94a4;
  margin-bottom:2px;
}

.map-box{
  margin-top:18px;
  border-radius:15px;
  min-height:170px;
  background:
    linear-gradient(135deg,#e8eef7,#dce5f3);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#526174;
  text-align:center;
  padding:20px;
}

/* ================= ENQUIRY ================= */

.form{
  display:grid;
  gap:13px;
}

.form input,
.form textarea{
  width:100%;
  border:1px solid #dce2ec;
  border-radius:12px;
  padding:13px 14px;
  font:inherit;
  outline:none;
}

.form input:focus,
.form textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.form textarea{
  min-height:120px;
  resize:vertical;
}

.success-message{
  display:none;
  padding:13px;
  background:#ecfdf5;
  color:#15803d;
  border:1px solid #bbf7d0;
  border-radius:12px;
  margin-top:10px;
}

/* ================= RATING ================= */

.rating-bars{
  display:grid;
  gap:10px;
}

.rating-row{
  display:grid;
  grid-template-columns:25px 1fr 45px;
  gap:8px;
  align-items:center;
  font-size:13px;
}

.bar{
  height:8px;
  background:#edf0f5;
  border-radius:20px;
  overflow:hidden;
}

.bar span{
  display:block;
  height:100%;
  background:#f59e0b;
  border-radius:20px;
}

/* ================= CTA ================= */

.cta{
  margin-top:30px;
  background:#111827;
  color:#fff;
  border-radius:22px;
  padding:34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.cta h2{
  margin-bottom:5px;
}

.cta p{
  color:#c5cad3;
}

/* ================= FOOTER ================= */

footer{
  background:#111827;
  color:#c8ced8;
  padding:30px 0;
  margin-top:40px;
}

.footer-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}

.footer-logo{
  color:#fff;
  font-size:22px;
  font-weight:800;
}

.footer-links{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  font-size:14px;
}

/* ================= LIGHTBOX ================= */

.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:3000;
  padding:20px;
}

.lightbox.active{
  display:flex;
}

.lightbox-content{
  max-width:1000px;
  width:100%;
  max-height:90vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.lightbox-content img,
.lightbox-content video{
  max-width:100%;
  max-height:85vh;
  border-radius:12px;
}

.close-lightbox{
  position:absolute;
  top:18px;
  right:20px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#111827;
  font-size:24px;
  cursor:pointer;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  background:#111827;
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:4000;
  font-size:14px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE BAR ================= */

.mobile-action-bar{
  display:none;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .nav-links,
  .nav-buttons{
    display:none;
  }

  .menu-btn{
    display:block;
  }

  .hero-grid{
    grid-template-columns:1fr;
  }

  .hero-image,
  .hero-image img{
    min-height:300px;
  }

  .hero-content{
    padding:28px;
  }

  .hero-content h1{
    font-size:34px;
  }

  .content-grid{
    grid-template-columns:1fr;
  }

  .cta{
    flex-direction:column;
    align-items:flex-start;
  }

}

@media(max-width:650px){

  body{
    padding-bottom:72px;
  }

  .page{
    padding-top:18px;
  }

  .hero{
    border-radius:18px;
  }

  .hero-image,
  .hero-image img{
    min-height:260px;
  }

  .hero-content{
    padding:22px;
  }

  .hero-content h1{
    font-size:30px;
  }

  .hero-actions .btn{
    flex:1;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

  .dynamic-media{
    grid-template-columns:repeat(2,1fr);
  }

  .services,
  .offers{
    grid-template-columns:1fr;
  }

  .card{
    padding:19px;
  }

  .mobile-action-bar{
    position:fixed;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    left:0;
    right:0;
    bottom:0;
    padding:8px;
    background:rgba(255,255,255,.97);
    border-top:1px solid #dfe4ed;
    z-index:2000;
    box-shadow:0 -5px 20px rgba(0,0,0,.08);
  }

  .mobile-action-bar a,
  .mobile-action-bar button{
    border:0;
    border-radius:10px;
    padding:9px 3px;
    font-size:11px;
    font-weight:700;
    background:#eef4ff;
    color:#2563eb;
    text-align:center;
    cursor:pointer;
  }

  .mobile-action-bar .whatsapp{
    background:#ecfdf5;
    color:#15803d;
  }

  .mobile-action-bar .enquiry{
    background:#2563eb;
    color:#fff;
  }

  .mobile-action-bar .share{
    background:#111827;
    color:#fff;
  }

}

</style>

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="container nav">

    <a href="index.html" class="logo">
      Boostly<span>.</span>
    </a>

    <nav class="nav-links">

      <a href="index.html">Home</a>

      <a href="explore.html">Explore</a>

      <a href="explore.html#categories">Categories</a>

      <a href="explore.html#businesses">Businesses</a>

      <a href="#contact">Contact</a>

    </nav>

    <div class="nav-buttons">

      <a href="index.html#grow" class="btn btn-primary">
        Get Started
      </a>

    </div>

    <button
      class="menu-btn"
      id="menuBtn"
      aria-label="Open menu"
    >
      ☰
    </button>

  </div>

</header>


<!-- ================= MAIN ================= -->

<main class="page">

<div class="container">

  <div class="breadcrumb">

    <a href="index.html">Home</a>
    /
    <a href="explore.html">Explore</a>
    /
    <span id="breadcrumbName">Business Profile</span>

  </div>


  <!-- ================= HERO ================= -->

  <section class="hero">

    <div class="hero-grid">

      <div class="hero-image">

        <img
          src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1200&q=85"
          alt="Business"
          id="businessHeroImage"
          loading="eager"
        >

        <div class="verified">
          ✓ Verified Business
        </div>

      </div>


      <div class="hero-content">

        <div
          class="category"
          data-business-category
        >
          Beauty & Hair
        </div>

        <h1 data-business-name>
          Royal Look Salon
        </h1>

        <div class="rating">

          <div class="stars">
            ★★★★★
          </div>

          <strong>4.8</strong>

          <span>
            126 reviews
          </span>

        </div>


        <p
          class="hero-description"
          data-business-description
        >
          Professional beauty and hair services for your everyday style and special occasions.
        </p>


        <div class="hero-actions">

          <a
            href="#"
            class="btn btn-primary"
            data-business-call
          >
            ☎ Call
          </a>

          <a
            href="#"
            class="btn btn-success"
            data-business-whatsapp
            target="_blank"
            rel="noopener"
          >
            WhatsApp
          </a>

          <a
            href="#enquiry"
            class="btn btn-secondary"
          >
            Enquiry
          </a>

        </div>


        <div class="hero-tools">

          <button
            class="btn btn-outline"
            type="button"
            id="shareBtn"
          >
            ↗ Share
          </button>

          <button
            class="btn btn-outline"
            type="button"
            id="saveBtn"
          >
