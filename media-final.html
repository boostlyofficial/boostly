<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boostly Media Studio</title>

<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #e5e7eb;
}

.nav{
  max-width:850px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:28px;
  font-weight:800;
  color:#5138ee;
}

.back{
  text-decoration:none;
  color:#172033;
  background:#eef0f6;
  padding:12px 16px;
  border-radius:10px;
  font-weight:700;
}

.container{
  max-width:700px;
  margin:35px auto;
  padding:0 18px;
}

.hero{
  text-align:center;
  margin-bottom:25px;
}

.hero h1{
  font-size:30px;
  margin:0 0 10px;
}

.hero p{
  color:#697386;
}

.card{
  background:#fff;
  padding:24px;
  border-radius:20px;
  box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.card h2{
  margin-top:0;
}

.caption{
  width:100%;
  padding:15px;
  border:1px solid #d7dbe4;
  border-radius:11px;
  font-size:16px;
  margin:10px 0 16px;
}

.upload{
  width:100%;
  border:0;
  padding:17px;
  border-radius:12px;
  background:#5138ee;
  color:white;
  font-size:18px;
  font-weight:700;
}

.upload:disabled{
  opacity:.65;
}

.status{
  display:none;
  margin-top:16px;
  padding:15px;
  border-radius:11px;
  line-height:1.5;
  word-break:break-word;
}

.info{
  display:block;
  background:#edf4ff;
  color:#24599c;
}

.success{
  display:block;
  background:#e8f8ee;
  color:#19733d;
}

.error{
  display:block;
  background:#ffe8e8;
  color:#a32222;
}

.result{
  margin-top:18px;
}

.result img,
.result video{
  width:100%;
  max-height:400px;
  object-fit:contain;
  border-radius:14px;
  background:#111;
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">Boostly</div>

    <a href="/dashboard.html" class="back">
      ← Dashboard
    </a>
  </div>
</header>

<div class="container">

  <div class="hero">
    <h1>🚀 Boostly Media Studio</h1>
    <p>
      Upload photos and Boosts for your business.
    </p>
  </div>

  <div class="card">

    <h2>📸 Add Photo or 🎬 Boost</h2>

    <p>
      Select a photo or short video and add a caption.
    </p>

    <input
      id="caption"
      class="caption"
      type="text"
      maxlength="300"
      placeholder="Write a caption or offer..."
    >

    <button
      id="uploadBtn"
      class="upload"
      type="button">
      📤 Select Photo or Video
    </button>

    <div id="status" class="status"></div>

    <div id="result" class="result"></div>

  </div>

</div>

<script>

let business = null;
let widget = null;

const button =
  document.getElementById("uploadBtn");

const caption =
  document.getElementById("caption");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");


function status(message,type){

  statusBox.className =
    "status " + type;

  statusBox.textContent =
    message;

}


async function loadBusiness(){

  const response =
    await fetch(
      "/api/my-business",
      {
        credentials:"include"
      }
    );

  const text =
    await response.text();

  if(!response.ok){

    throw new Error(
      "Business profile error " +
      response.status
    );

  }

  business =
    JSON.parse(text);

  if(!business.id){

    throw new Error(
      "Business profile ID nahi mila."
    );

  }

}


async function saveMedia(info){

  try{

    status(
      "💾 Step 2/2: Boostly database me save ho raha hai...",
      "info"
    );

    const form =
      new FormData();

    form.append(
      "business_id",
      String(business.id)
    );

    form.append(
      "media_type",
      info.resource_type === "video"
        ? "boost"
        : "photo"
    );

    form.append(
      "media_url",
      info.secure_url
    );

    form.append(
      "public_id",
      info.public_id || ""
    );

    form.append(
      "caption",
      caption.value.trim()
    );


    const response =
      await fetch(
        "/api/save-media",
        {
          method:"POST",
          credentials:"include",
          body:form
        }
      );


    const text =
      await response.text();


    if(!response.ok){

      throw new Error(
        "Boostly API error " +
        response.status +
        ": " +
        text
      );

    }


    const data =
      JSON.parse(text);


    if(data.success !== true){

      throw new Error(
        data.error ||
        "Media save failed"
      );

    }


    if(info.resource_type === "video"){

      resultBox.innerHTML =
        "<video controls src=\"" +
        info.secure_url +
        "\"></video>";

      status(
        "🎬 Boost successfully uploaded!",
        "success"
      );

    }else{

      resultBox.innerHTML =
        "<img src=\"" +
        info.secure_url +
        "\" alt=\"Boostly photo\">";

      status(
        "📸 Photo successfully uploaded!",
        "success"
      );

    }


    caption.value = "";

    button.disabled = false;

    button.textContent =
      "📤 Select Photo or Video";


    alert(
      info.resource_type === "video"
        ? "🎬 Boost successfully uploaded!"
        : "📸 Photo successfully uploaded!"
    );


  }catch(error){

    console.error(error);

    button.disabled = false;

    button.textContent =
      "📤 Select Photo or Video";

    status(
      "❌ " + error.message,
      "error"
    );

    alert(
      "Save Error:\n\n" +
      error.message
    );

  }

}


/* CLOUDINARY WIDGET */

function createWidget(){

  widget =
    cloudinary.createUploadWidget(

      {
        cloudName:"zszjccck",

        uploadPreset:"boostly_media",

        sources:[
          "local"
        ],

        multiple:false,

        resourceType:"auto",

        maxFileSize:52428800,

        clientAllowedFormats:[
          "jpg",
          "jpeg",
          "png",
          "webp",
          "mp4",
          "mov",
          "webm"
        ],

        folder:"boostly",

        cropping:false,

        showAdvancedOptions:false,

        showSkipCropButton:false

      },

      async function(error,result){

        if(error){

          console.error(error);

          button.disabled = false;

          button.textContent =
            "📤 Select Photo or Video";

          status(
            "❌ Cloudinary error: " +
            (
              error.message ||
              error.status ||
              "Upload failed"
            ),
            "error"
          );

          return;
        }


        if(
          result &&
          result.event === "upload-added"
        ){

          status(
            "☁️ Step 1/2: Cloudinary par upload ho raha hai...",
            "info"
          );

        }


        if(
          result &&
          result.event === "success"
        ){

          await saveMedia(
            result.info
          );

        }

      }

    );

}


/* BUTTON */

button.addEventListener(
  "click",
  async function(){

    try{

      button.disabled = true;

      button.textContent =
        "Opening uploader...";


      status(
        "⏳ Business profile check ho raha hai...",
        "info"
      );


      await loadBusiness();


      if(!widget){

        status(
          "☁️ Cloudinary uploader open ho raha hai...",
          "info"
        );

        createWidget();

      }


      widget.open();

    }

    catch(error){

      console.error(error);

      button.disabled = false;

      button.textContent =
        "📤 Select Photo or Video";

      status(
        "❌ " + error.message,
        "error"
      );

      alert(
        "Upload Error:\n\n" +
        error.message
      );

    }

  }
);

</script>

</body>
</html>
