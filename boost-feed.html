<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boost Feed | Boostly</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  max-width:1100px;
  margin:auto;
  min-height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  text-decoration:none;
  font-size:24px;
  font-weight:800;
  color:#111827;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:18px;
}

.nav-links a{
  text-decoration:none;
  color:#4b5563;
  font-size:14px;
  font-weight:600;
}

.nav-links a:hover{
  color:#111827;
}

.nav-btn{
  background:#111827;
  color:#fff !important;
  padding:10px 15px;
  border-radius:8px;
}

.menu{
  display:none;
  border:0;
  background:none;
  font-size:26px;
  cursor:pointer;
}

.container{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:25px 15px 50px;
}

.top-area{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:20px;
}

.top-area h1{
  font-size:28px;
}

.create-btn{
  text-decoration:none;
  background:#111827;
  color:#fff;
  padding:11px 15px;
  border-radius:9px;
  font-weight:700;
  font-size:14px;
}

.status{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:18px;
  text-align:center;
  color:#6b7280;
  margin-bottom:18px;
}

.post{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:hidden;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.post-head{
  display:flex;
  align-items:center;
  gap:11px;
  padding:15px;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#e5e7eb;
}

.business-info{
  flex:1;
}

.business-name{
  font-size:15px;
  font-weight:800;
  color:#111827;
}

.post-meta{
  margin-top:3px;
  color:#6b7280;
  font-size:12px;
}

.post-media{
  width:100%;
  background:#f3f4f6;
}

.post-media img,
.post-media video{
  width:100%;
  max-height:600px;
  display:block;
  object-fit:cover;
}

.post-body{
  padding:15px;
}

.caption{
  font-size:14px;
  line-height:1.6;
  margin-bottom:10px;
  white-space:pre-wrap;
}

.location{
  color:#6b7280;
  font-size:13px;
  margin-bottom:7px;
}

.hashtags{
  color:#2563eb;
  font-size:13px;
}

.stats{
  display:flex;
  gap:18px;
  padding:12px 15px;
  border-top:1px solid #f0f0f0;
  color:#6b7280;
  font-size:13px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid #e5e7eb;
}

.action-btn{
  border:0;
  background:#fff;
  padding:13px 5px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  color:#4b5563;
}

.action-btn:hover{
  background:#f9fafb;
}

.action-btn.liked{
  color:#dc2626;
}

.empty{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:40px 20px;
  text-align:center;
}

.empty h2{
  margin-bottom:8px;
}

.empty p{
  color:#6b7280;
  margin-bottom:18px;
}

@media(max-width:700px){

  .nav{
    min-height:58px;
  }

  .menu{
    display:block;
  }

  .nav-links{
    display:none;
    position:absolute;
    left:0;
    right:0;
    top:58px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    padding:15px;
    flex-direction:column;
    align-items:stretch;
  }

  .nav-links.show{
    display:flex;
  }

  .nav-links a{
    padding:10px;
  }

  .top-area{
    align-items:flex-start;
  }

  .top-area h1{
    font-size:23px;
  }

  .create-btn{
    font-size:12px;
    padding:9px 11px;
  }

  .actions{
    grid-template-columns:repeat(4,1fr);
  }

  .action-btn{
    font-size:11px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <a href="index.html" class="logo">Boostly</a>

    <button class="menu" onclick="toggleMenu()">☰</button>

    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="explore.html">Explore</a>
      <a href="boost-feed.html">Boost Feed</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="create-post.html" class="nav-btn">Create Post</a>
    </nav>

  </div>
</header>


<main class="container">

  <div class="top-area">
    <h1>Boost Feed</h1>
    <a href="create-post.html" class="create-btn">+ Create Post</a>
  </div>

  <div id="status" class="status">
    Loading posts...
  </div>

  <div id="feed"></div>

</main>


<script>

const API = "/api/boost-post";

const BUSINESS_ID = 1;


/* ================================
   MOBILE MENU
================================ */

function toggleMenu(){

  document
    .getElementById("navLinks")
    .classList.toggle("show");

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================================
   LOAD POSTS
================================ */

async function loadPosts(){

  const status = document.getElementById("status");
  const feed = document.getElementById("feed");

  try{

    const response = await fetch(
      API +
      "?business_id=" +
      BUSINESS_ID +
      "&_=" +
      Date.now(),
      {
        method:"GET",
        credentials:"include",
        cache:"no-store"
      }
    );

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "Failed to load posts"
      );

    }

    const posts = data.posts || [];

    status.style.display = "none";

    if(posts.length === 0){

      feed.innerHTML = `
        <div class="empty">
          <h2>No posts yet</h2>
          <p>Create your first Boost Post.</p>
          <a href="create-post.html"
             class="create-btn">
             Create Post
          </a>
        </div>
      `;

      return;

    }

    feed.innerHTML = posts
      .map(renderPost)
      .join("");

  }catch(error){

    console.error(error);

    status.innerHTML =
      "Unable to load posts. Please refresh the page.";

  }

}


/* ================================
   RENDER POST
================================ */

function renderPost(post){

  const id = Number(post.id);

  const businessName =
    escapeHtml(
      post.business_name ||
      "Boostly Business"
    );

  const caption =
    escapeHtml(post.caption || "");

  const location =
    escapeHtml(post.location || "");

  const hashtags =
    escapeHtml(post.hashtags || "");

  const likes =
    Number(post.likes_count || 0);

  const comments =
    Number(post.comments_count || 0);

  const shares =
    Number(post.shares_count || 0);

  const saves =
    Number(post.saves_count || 0);

  const liked =
    Boolean(post.liked);

  let media = "";

  if(
    post.media_type === "video" &&
    post.media_url
  ){

    media = `
      <video
        src="${escapeHtml(post.media_url)}"
        controls
        playsinline>
      </video>
    `;

  }else if(post.media_url){

    media = `
      <img
        src="${escapeHtml(post.media_url)}"
        alt="${businessName}"
        loading="lazy">
    `;

  }

  return `

    <article class="post" id="post-${id}">

      <div class="post-head">

        <img
          class="avatar"
          src="${escapeHtml(
            post.business_logo ||
            post.thumbnail_url ||
            ""
          )}"
          alt="Business">

        <div class="business-info">

          <div class="business-name">
            ${businessName}
          </div>

          <div class="post-meta">
            Boostly Post
          </div>

        </div>

      </div>


      ${
        media
        ?
        `<div class="post-media">${media}</div>`
        :
        ""
      }


      <div class="post-body">

        ${
          caption
          ?
          `<div class="caption">${caption}</div>`
          :
          ""
        }

        ${
          location
          ?
          `<div class="location">📍 ${location}</div>`
          :
          ""
        }

        ${
          hashtags
          ?
          `<div class="hashtags">${hashtags}</div>`
          :
          ""
        }

      </div>


      <div class="stats">

        <span>
          ❤️ <span id="like-count-${id}">
            ${likes}
          </span> Likes
        </span>

        <span>
          💬 ${comments} Comments
        </span>

        <span>
          🔗 ${shares} Shares
        </span>

        <span>
          🔖 ${saves} Saves
        </span>

      </div>


      <div class="actions">

        <button
          class="action-btn ${liked ? "liked" : ""}"
          id="like-btn-${id}"
          data-action="${liked ? "unlike" : "like"}"
          onclick="toggleLike(${id})">

          ${
            liked
            ? "❤️ Liked"
            : "♡ Like"
          }

        </button>


        <button
          class="action-btn"
          onclick="commentPost(${id})">

          💬 Comment

        </button>


        <button
          class="action-btn"
          onclick="savePost(${id})">

          🔖 Save

        </button>


        <button
          class="action-btn"
          onclick="sharePost(${id})">

          🔗 Share

        </button>

      </div>

    </article>

  `;

}


/* ================================
   LIKE / UNLIKE
================================ */

async function toggleLike(postId){

  const button =
    document.getElementById(
      "like-btn-" + postId
    );

  const count =
    document.getElementById(
      "like-count-" + postId
    );

  if(!button){
    return;
  }

  const action =
    button.dataset.action || "like";


  /* Prevent double click */

  button.disabled = true;


  try{

    const formData = new FormData();

    formData.append("action", action);
    formData.append("post_id", postId);


    const response = await fetch(
      API,
      {
        method:"POST",
        body:formData,
        credentials:"include"
      }
    );


    const data = await response.json();


    if(response.status === 401){

      alert(
        "Please login first to like this post."
      );

      return;

    }


    if(!response.ok){

      throw new Error(
        data.error || "Like action failed"
      );

    }


    /* Update count */

    if(
      data.likes_count !== undefined
    ){

      count.textContent =
        Number(data.likes_count);

    }


    /* Update button */

    if(data.liked){

      button.classList.add("liked");

      button.textContent =
        "❤️ Liked";

      button.dataset.action =
        "unlike";

    }else{

      button.classList.remove("liked");

      button.textContent =
        "♡ Like";

      button.dataset.action =
        "like";

    }


  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Like system error"
    );

  }finally{

    button.disabled = false;

  }

}


/* ================================
   COMMENT
================================ */

function commentPost(postId){

  alert(
    "Comment system next step mein connect hoga."
  );

}


/* ================================
   SAVE
================================ */

function savePost(postId){

  alert(
    "Save system next step mein connect hoga."
  );

}


/* ================================
   SHARE
================================ */

async function sharePost(postId){

  const shareUrl =
    window.location.origin +
    "/boost-feed.html#post-" +
    postId;


  try{

    if(
      navigator.share
    ){

      await navigator.share({
        title:"Boostly Post",
        text:"Check this business post on Boostly",
        url:shareUrl
      });

    }else if(
      navigator.clipboard
    ){

      await navigator.clipboard.writeText(
        shareUrl
      );

      alert(
        "Post link copied!"
      );

    }else{

      prompt(
        "Copy this link:",
        shareUrl
      );

    }

  }catch(error){

    console.log(
      "Share cancelled",
      error
    );

  }

}


/* ================================
   START
================================ */

loadPosts();

</script>

</body>
</html>
