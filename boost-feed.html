<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boost Feed | Boostly</title>

<meta name="description"
content="Discover local business posts, reels, offers and updates on Boostly.">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =========================
   HEADER
========================= */

header{
  background:#ffffff;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  max-width:1100px;
  margin:auto;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.logo{
  font-size:25px;
  font-weight:800;
  color:#111827;
}

.logo span{
  color:#2563eb;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:22px;
}

.nav-links a{
  font-size:14px;
  font-weight:600;
  color:#4b5563;
}

.nav-links a:hover{
  color:#2563eb;
}

.nav-btn{
  background:#2563eb;
  color:#fff !important;
  padding:11px 17px;
  border-radius:10px;
}

.menu-btn{
  display:none;
  border:0;
  background:none;
  font-size:27px;
  cursor:pointer;
}

/* =========================
   HERO
========================= */

.hero{
  max-width:900px;
  margin:30px auto 20px;
  padding:0 16px;
}

.hero-box{
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.05);
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#6b7280;
  line-height:1.6;
}

.create-btn{
  display:inline-block;
  margin-top:18px;
  background:#111827;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  font-weight:700;
}

/* =========================
   FEED
========================= */

.feed{
  width:100%;
  max-width:650px;
  margin:25px auto 60px;
  padding:0 12px;
}

.status{
  text-align:center;
  padding:30px 10px;
  color:#6b7280;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}

/* =========================
   POST CARD
========================= */

.post-card{
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  margin-bottom:22px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.04);
}

/* Business */

.post-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px;
}

.business-info{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:18px;
}

.business-name{
  font-weight:800;
  font-size:15px;
}

.business-meta{
  margin-top:3px;
  color:#6b7280;
  font-size:12px;
}

.post-type{
  background:#eef2ff;
  color:#3730a3;
  padding:6px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
}

/* Media */

.media-wrap{
  width:100%;
  background:#111827;
}

.media-wrap img,
.media-wrap video{
  display:block;
  width:100%;
  max-height:650px;
  object-fit:cover;
}

.media-wrap video{
  background:#000;
}

/* Content */

.post-content{
  padding:15px;
}

.caption{
  font-size:14px;
  line-height:1.6;
  color:#1f2937;
  white-space:pre-wrap;
}

.hashtags{
  margin-top:8px;
  color:#2563eb;
  font-size:13px;
}

.location{
  margin-top:10px;
  color:#6b7280;
  font-size:12px;
}

/* Stats */

.stats{
  display:flex;
  gap:18px;
  padding:0 15px 10px;
  color:#6b7280;
  font-size:12px;
}

/* Actions */

.actions{
  border-top:1px solid #e5e7eb;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.action-btn{
  border:0;
  background:#fff;
  padding:13px 5px;
  cursor:pointer;
  font-size:13px;
  color:#374151;
  font-weight:600;
}

.action-btn:hover{
  background:#f9fafb;
}

.action-btn.like-active{
  color:#dc2626;
}

.action-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

/* Footer */

.footer{
  text-align:center;
  color:#9ca3af;
  font-size:12px;
  padding:30px 15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .nav{
    min-height:62px;
  }

  .menu-btn{
    display:block;
  }

  .nav-links{
    display:none;
    position:absolute;
    left:0;
    right:0;
    top:62px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    flex-direction:column;
    align-items:stretch;
    gap:0;
    padding:8px 16px 16px;
  }

  .nav-links.show{
    display:flex;
  }

  .nav-links a{
    padding:13px 8px;
  }

  .nav-btn{
    text-align:center;
    margin-top:5px;
  }

  .hero{
    margin-top:18px;
  }

  .hero-box{
    padding:20px;
  }

  .hero h1{
    font-size:25px;
  }

  .feed{
    padding:0 8px;
    margin-top:18px;
  }

  .post-card{
    border-radius:15px;
  }

  .post-header{
    padding:13px;
  }

  .post-content{
    padding:13px;
  }

  .stats{
    padding-left:13px;
    padding-right:13px;
  }

  .action-btn{
    font-size:11px;
  }

  .action-icon{
    font-size:18px;
  }

}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

  <div class="nav">

    <a href="index.html" class="logo">
      Boost<span>ly</span>
    </a>

    <button
      class="menu-btn"
      onclick="toggleMenu()"
      aria-label="Open menu">
      ☰
    </button>

    <nav class="nav-links" id="navLinks">

      <a href="index.html">Home</a>

      <a href="explore.html">Explore</a>

      <a href="boost-feed.html">Boost Feed</a>

      <a href="dashboard.html">Dashboard</a>

      <a
        href="create-post.html"
        class="nav-btn">
        Create Post
      </a>

    </nav>

  </div>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <div class="hero-box">

    <h1>Boost Feed</h1>

    <p>
      Discover local businesses, posts, reels,
      offers and updates from businesses on Boostly.
    </p>

    <a
      href="create-post.html"
      class="create-btn">
      + Create Post
    </a>

  </div>

</section>


<!-- =========================
     FEED
========================= -->

<main class="feed">

  <div
    id="feedStatus"
    class="status">
    Loading Boost Feed...
  </div>

  <div id="feed"></div>

</main>


<footer class="footer">
  © 2026 Boostly. All rights reserved.
</footer>


<script>

/* =====================================================
   MOBILE MENU
===================================================== */

function toggleMenu(){

  const nav =
    document.getElementById("navLinks");

  nav.classList.toggle("show");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   GET BUSINESS INITIAL
===================================================== */

function getInitial(name){

  if(!name){
    return "B";
  }

  return name
    .trim()
    .charAt(0)
    .toUpperCase();

}


/* =====================================================
   FORMAT NUMBERS
===================================================== */

function formatNumber(number){

  number =
    Number(number || 0);

  if(number >= 1000000){
    return (
      (number / 1000000)
        .toFixed(1)
        .replace(".0","")
      + "M"
    );
  }

  if(number >= 1000){
    return (
      (number / 1000)
        .toFixed(1)
        .replace(".0","")
      + "K"
    );
  }

  return String(number);

}


/* =====================================================
   LOAD FEED
===================================================== */

async function loadFeed(){

  const feed =
    document.getElementById("feed");

  const status =
    document.getElementById("feedStatus");

  status.style.display = "block";

  status.textContent =
    "Loading Boost Feed...";


  try{

    const response =
      await fetch(
        "/api/boost-post?business_id=1",
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      throw new Error(
        data.error ||
        "Unable to load feed"
      );

    }


    const posts =
      data.posts || [];


    status.style.display = "none";


    if(posts.length === 0){

      status.style.display = "block";

      status.innerHTML = `
        <div>
          <strong>No posts yet.</strong>
          <br><br>
          Be the first business to create a Boost Post.
        </div>
      `;

      return;

    }


    feed.innerHTML =
      posts
        .map(renderPost)
        .join("");


  }catch(error){

    console.error(error);

    status.style.display = "block";

    status.innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message ||
          "Something went wrong"
        )}
      </div>
    `;

  }

}


/* =====================================================
   RENDER POST
===================================================== */

function renderPost(post){

  const businessName =
    post.business_name ||
    "Boostly Business";

  const category =
    post.category ||
    "Local Business";

  const city =
    post.city ||
    "";

  const initial =
    getInitial(businessName);

  const postType =
    post.post_type === "reel"
      ? "REEL"
      : "POST";

  const liked =
    post.liked === true;

  let media = "";


  /* ---------------------------------------------
     VIDEO
  --------------------------------------------- */

  if(post.media_type === "video"){

    const videoUrl =
      escapeHtml(post.media_url);

    const poster =
      post.thumbnail_url
        ? `poster="${escapeHtml(post.thumbnail_url)}"`
        : "";

    media = `
      <div class="media-wrap">

        <video
          controls
          playsinline
          preload="metadata"
          ${poster}>

          <source
            src="${videoUrl}"
            type="video/mp4">

          Your browser does not support video.

        </video>

      </div>
    `;

  }


  /* ---------------------------------------------
     IMAGE
  --------------------------------------------- */

  else{

    media = `
      <div class="media-wrap">

        <img
          src="${escapeHtml(post.media_url)}"
          alt="${escapeHtml(businessName)} post"
          loading="lazy"
          onerror="this.style.display='none';">

      </div>
    `;

  }


  return `

    <article
      class="post-card"
      data-post-id="${post.id}">

      <!-- BUSINESS HEADER -->

      <div class="post-header">

        <div class="business-info">

          <div class="avatar">
            ${escapeHtml(initial)}
          </div>

          <div>

            <div class="business-name">
              ${escapeHtml(businessName)}
            </div>

            <div class="business-meta">
              ${escapeHtml(category)}
              ${city ? " • " + escapeHtml(city) : ""}
            </div>

          </div>

        </div>

        <div class="post-type">
          ${postType}
        </div>

      </div>


      <!-- MEDIA -->

      ${media}


      <!-- CONTENT -->

      <div class="post-content">

        ${
          post.caption
            ? `
              <div class="caption">
                ${escapeHtml(post.caption)}
              </div>
            `
            : ""
        }


        ${
          post.hashtags
            ? `
              <div class="hashtags">
                ${escapeHtml(post.hashtags)}
              </div>
            `
            : ""
        }


        ${
          post.location
            ? `
              <div class="location">
                📍 ${escapeHtml(post.location)}
              </div>
            `
            : ""
        }

      </div>


      <!-- STATS -->

      <div class="stats">

        <span class="like-count">
          ❤️ ${formatNumber(post.likes_count)} likes
        </span>

        <span>
          💬 ${formatNumber(post.comments_count)} comments
        </span>

        <span>
          👁 ${formatNumber(post.views_count)} views
        </span>

      </div>


      <!-- ACTIONS -->

      <div class="actions">

        <button
          class="action-btn like-button ${liked ? "like-active" : ""}"
          onclick="toggleLike(${post.id}, this)">

          <span class="action-icon">
            ${liked ? "❤️" : "♡"}
          </span>

          <span class="like-text">
            ${liked ? "Liked" : "Like"}
          </span>

        </button>


        <button
          class="action-btn"
          onclick="commentPost(${post.id})">

          <span class="action-icon">
            💬
          </span>

          Comment

        </button>


        <button
          class="action-btn"
          onclick="savePost(${post.id})">

          <span class="action-icon">
            🔖
          </span>

          Save

        </button>


        <button
          class="action-btn"
          onclick="sharePost(${post.id})">

          <span class="action-icon">
            ↗️
          </span>

          Share

        </button>

      </div>

    </article>

  `;

}


/* =====================================================
   LIKE / UNLIKE
===================================================== */

async function toggleLike(
  postId,
  button
){

  if(
    button.dataset.loading === "true"
  ){
    return;
  }


  button.dataset.loading = "true";


  const wasLiked =
    button.classList.contains(
      "like-active"
    );


  const action =
    wasLiked
      ? "unlike"
      : "like";


  try{

    const formData =
      new FormData();

    formData.append(
      "action",
      action
    );

    formData.append(
      "post_id",
      postId
    );


    const response =
      await fetch(
        "/api/boost-post",
        {
          method:"POST",
          body:formData
        }
      );


    const data =
      await response.json();


    if(
      response.status === 401
    ){

      alert(
        "Please login first to like this post."
      );

      return;

    }


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "Unable to update like"
      );

    }


    /* ---------------------------------------------
       UPDATE BUTTON
    --------------------------------------------- */

    if(data.liked){

      button.classList.add(
        "like-active"
      );

      button.querySelector(
        ".action-icon"
      ).textContent = "❤️";

      button.querySelector(
        ".like-text"
      ).textContent = "Liked";

    }else{

      button.classList.remove(
        "like-active"
      );

      button.querySelector(
        ".action-icon"
      ).textContent = "♡";

      button.querySelector(
        ".like-text"
      ).textContent = "Like";

    }


    /* ---------------------------------------------
       UPDATE COUNT
    --------------------------------------------- */

    const card =
      button.closest(
        ".post-card"
      );

    const countElement =
      card.querySelector(
        ".like-count"
      );


    if(countElement){

      countElement.textContent =
        "❤️ " +
        formatNumber(
          data.likes_count
        ) +
        " likes";

    }


  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Unable to like post"
    );

  }finally{

    button.dataset.loading =
      "false";

  }

}


/* =====================================================
   COMMENT
===================================================== */

function commentPost(postId){

  alert(
    "Comment system next step mein connect hoga."
  );

}


/* =====================================================
   SAVE
===================================================== */

function savePost(postId){

  alert(
    "Save system next step mein connect hoga."
  );

}


/* =====================================================
   SHARE
===================================================== */

async function sharePost(postId){

  const shareUrl =
    window.location.origin +
    "/boost-feed.html#post-" +
    postId;


  try{

    if(
      navigator.share
    ){

      await navigator.share({

        title:"Boostly Post",

        text:
          "Check this business post on Boostly.",

        url:shareUrl

      });

    }else{

      await navigator.clipboard.writeText(
        shareUrl
      );

      alert(
        "Post link copied!"
      );

    }

  }catch(error){

    if(
      error.name !==
      "AbortError"
    ){

      try{

        await navigator.clipboard.writeText(
          shareUrl
        );

        alert(
          "Post link copied!"
        );

      }catch(e){

        alert(
          "Unable to share post."
        );

      }

    }

  }

}


/* =====================================================
   START
===================================================== */

loadFeed();

</script>

</body>
</html>
