<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boostly Media Studio</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  border-bottom:1px solid #e7eaf0;
  padding:16px;
}

.nav{
  max-width:900px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:28px;
  font-weight:800;
  color:#6c4cff;
}

.back{
  text-decoration:none;
  background:#eef0f7;
  color:#172033;
  padding:12px 16px;
  border-radius:10px;
  font-weight:700;
}

.container{
  max-width:700px;
  margin:30px auto;
  padding:0 18px;
}

.hero{
  text-align:center;
  margin-bottom:25px;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#687286;
}

.card{
  background:white;
  border-radius:20px;
  padding:24px;
  box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.card h2{
  margin-bottom:10px;
}

.card p{
  color:#687286;
  margin-bottom:20px;
}

input[type=file]{
  width:100%;
  padding:16px;
  border:2px dashed #ccd2dd;
  border-radius:12px;
  background:#fafbfc;
}

.preview{
  margin-top:18px;
}

.preview img,
.preview video{
  width:100%;
  max-height:400px;
  object-fit:contain;
  background:#111;
  border-radius:14px;
}

.caption{
  width:100%;
  margin-top:16px;
  padding:15px;
  border:1px solid #d9dde5;
  border-radius:11px;
  font-size:16px;
}

.upload{
  width:100%;
  margin-top:16px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#6c4cff;
  color:white;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}

.upload:disabled{
  opacity:.6;
}

.status{
  margin-top:16px;
  padding:15px;
  border-radius:11px;
  display:none;
  line-height:1.5;
  word-break:break-word;
}

.info{
  display:block;
  background:#edf4ff;
  color:#28589c;
}

.success{
  display:block;
  background:#e8f8ee;
  color:#19733d;
}

.error{
  display:block;
  background:#ffe8e8;
  color:#a32222;
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">Boostly</div>

    <a href="/dashboard.html" class="back">
      ← Dashboard
    </a>
  </div>
</header>

<div class="container">

  <div class="hero">
    <h1>🚀 Boostly Media Studio</h1>
    <p>
      Create photos and Boosts for your business.
    </p>
  </div>

  <div class="card">

    <h2>📸 Add Photo or 🎬 Boost</h2>

    <p>
      Select a photo or short video and add a caption.
    </p>

    <input
      id="mediaFile"
      type="file"
      accept="image/*,video/*"
    >

    <div
      id="preview"
      class="preview">
    </div>

    <input
      id="caption"
      class="caption"
      type="text"
      maxlength="300"
      placeholder="Write a caption or offer..."
    >

    <button
      id="uploadBtn"
      class="upload"
      type="button"
      onclick="uploadMedia()">

      Upload to Boostly

    </button>

    <div
      id="status"
      class="status">
    </div>

  </div>

</div>

<script>

let selectedFile = null;
let business = null;


const fileInput =
  document.getElementById("mediaFile");

const preview =
  document.getElementById("preview");

const button =
  document.getElementById("uploadBtn");

const statusBox =
  document.getElementById("status");


function status(message,type){

  statusBox.className =
    "status " + type;

  statusBox.innerText =
    message;

}


fileInput.addEventListener("change",function(){

  selectedFile =
    this.files[0];

  preview.innerHTML = "";

  if(!selectedFile){
    return;
  }


  if(
    selectedFile.size >
    50 * 1024 * 1024
  ){

    status(
      "❌ File 50 MB se chhoti honi chahiye.",
      "error"
    );

    selectedFile = null;
    fileInput.value = "";

    return;
  }


  if(
    selectedFile.type.startsWith("image/")
  ){

    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(selectedFile);

    preview.appendChild(img);

  }

  else if(
    selectedFile.type.startsWith("video/")
  ){

    const video =
      document.createElement("video");

    video.src =
      URL.createObjectURL(selectedFile);

    video.controls = true;

    preview.appendChild(video);

  }

});


async function getBusiness(){

  try{

    status(
      "⏳ Business profile check ho raha hai...",
      "info"
    );


    const response =
      await fetch(
        "/api/my-business",
        {
          method:"GET",
          credentials:"include"
        }
      );


    const text =
      await response.text();


    if(!response.ok){

      throw new Error(
        "Business API error " +
        response.status +
        ": " +
        text
      );

    }


    business =
      JSON.parse(text);


    if(!business.id){

      throw new Error(
        "Business ID nahi mila."
      );

    }


    status(
      "✅ Business ready.",
      "success"
    );


  }

  catch(error){

    console.error(error);

    status(
      "❌ " + error.message,
      "error"
    );

    throw error;

  }

}


async function uploadMedia(){

  try{

    button.disabled = true;

    button.innerText =
      "Uploading...";


    if(!selectedFile){

      throw new Error(
        "Pehle photo ya video select karo."
      );

    }


    if(!business){

      await getBusiness();

    }


    /*
      CLOUDINARY
    */

    status(
      "☁️ Step 1/2: Media upload ho raha hai...",
      "info"
    );


    const cloudinaryForm =
      new FormData();


    cloudinaryForm.append(
      "file",
      selectedFile
    );


    cloudinaryForm.append(
      "upload_preset",
      "boostly_media"
    );


    
const resourceType =
  selectedFile.type.startsWith("video/")
    ? "video"
    : "image";

const cloudinaryResponse =
  await fetch(
    "https://api.cloudinary.com/v1_1/boostlyindia/" +
    resourceType +
    "/upload",
    {
      method:"POST",
      body:cloudinaryForm
    }
  );

    const cloudinaryText =
      await cloudinaryResponse.text();


    if(!cloudinaryResponse.ok){

      throw new Error(
        "Cloudinary error: " +
        cloudinaryText
      );

    }


    let cloudinaryResult;

    try{

      cloudinaryResult =
        JSON.parse(cloudinaryText);

    }

    catch(e){

      throw new Error(
        "Cloudinary response samajh nahi aaya."
      );

    }


    if(
      !cloudinaryResult.secure_url
    ){

      throw new Error(
        "Cloudinary URL nahi mila."
      );

    }


    /*
      BOOSTLY DATABASE
    */

    status(
      "💾 Step 2/2: Boostly database me save ho raha hai...",
      "info"
    );


    const form =
      new FormData();


    form.append(
      "business_id",
      String(business.id)
    );


    form.append(
      "media_type",
      selectedFile.type.startsWith("video/")
        ? "boost"
        : "photo"
    );


    form.append(
      "media_url",
      cloudinaryResult.secure_url
    );


    form.append(
      "public_id",
      cloudinaryResult.public_id || ""
    );


    form.append(
      "caption",
      document
        .getElementById("caption")
        .value
        .trim()
    );


    const response =
      await fetch(
        "/api/media",
        {
          method:"POST",
          credentials:"include",
          body:form
        }
      );


    const responseText =
      await response.text();


    if(!response.ok){

      throw new Error(
        "Boostly API error " +
        response.status +
        ": " +
        responseText
      );

    }


    let result;

    try{

      result =
        JSON.parse(responseText);

    }

    catch(e){

      result = {};

    }


    if(result.success !== true){

      throw new Error(
        result.error ||
        "Media save nahi hua."
      );

    }


    status(
      selectedFile.type.startsWith("video/")
        ? "🎬 Boost successfully uploaded!"
        : "📸 Photo successfully uploaded!",
      "success"
    );


    alert(
      selectedFile.type.startsWith("video/")
        ? "🎬 Boost successfully uploaded!"
        : "📸 Photo successfully uploaded!"
    );


    fileInput.value = "";

    preview.innerHTML = "";

    document
      .getElementById("caption")
      .value = "";

    selectedFile = null;


  }

  catch(error){

    console.error(error);


    status(
      "❌ " +
      (
        error.message ||
        "Upload failed."
      ),
      "error"
    );


    alert(
      "Upload Error:\n\n" +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

  finally{

    button.disabled = false;

    button.innerText =
      "Upload to Boostly";

  }

}


getBusiness()
.catch(function(){
  button.disabled = false;
});

</script>

</body>
</html>
