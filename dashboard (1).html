<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boostly | Business Command Center</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --royal:#4c1d95;
  --royal2:#6d28d9;
  --sapphire:#1d4ed8;
  --blue:#2563eb;
  --gold:#c59b45;
  --gold2:#e5c477;

  --bg:#f7f5f1;
  --surface:#ffffff;
  --surface2:#fbf9f5;

  --text:#18152a;
  --muted:#716d7d;

  --border:#ebe5da;

  --shadow:
    0 14px 40px rgba(42,27,75,.09);
}


/* =========================
   BODY
========================= */

body{
  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;

  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(109,40,217,.09),
      transparent 28%
    ),
    radial-gradient(
      circle at 100% 0%,
      rgba(37,99,235,.07),
      transparent 25%
    ),
    linear-gradient(
      135deg,
      #faf9f6,
      #f4f1eb
    );

  color:var(--text);

  min-height:100vh;

  overflow-x:hidden;
}


/* =========================
   TOP BAR
========================= */

.topbar{
  height:72px;

  padding:0 4%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:
    rgba(255,255,255,.92);

  backdrop-filter:
    blur(18px);

  border-bottom:
    1px solid
    rgba(197,155,69,.18);

  position:sticky;

  top:0;

  z-index:100;

  box-shadow:
    0 4px 25px
    rgba(45,31,80,.05);
}


.logo{
  display:flex;

  align-items:center;

  gap:10px;

  font-size:23px;

  font-weight:900;

  letter-spacing:-.5px;
}


.logo-mark{
  width:37px;
  height:37px;

  border-radius:12px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--royal),
      var(--sapphire)
    );

  box-shadow:
    0 7px 20px
    rgba(76,29,149,.22),

    inset 0 1px 1px
    rgba(255,255,255,.3);
}


.logo span{
  background:
    linear-gradient(
      90deg,
      #25164b,
      #5b21b6,
      #9a742d
    );

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;
}


.top-actions{
  display:flex;

  align-items:center;

  gap:10px;
}


.explore{
  text-decoration:none;

  color:#574f67;

  font-size:14px;

  font-weight:800;

  padding:10px 14px;

  border-radius:10px;

  transition:.2s;
}


.explore:hover{
  background:#f4effa;

  color:var(--royal);
}


.logout{
  border:
    1px solid
    rgba(185,28,28,.14);

  background:#fff6f6;

  color:#b42323;

  padding:9px 14px;

  border-radius:10px;

  font-weight:800;

  cursor:pointer;

  transition:.2s;
}


.logout:hover{
  background:#fff0f0;
}


.avatar{
  width:40px;
  height:40px;

  border-radius:12px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#fff;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--royal),
      var(--sapphire)
    );

  box-shadow:
    0 7px 20px
    rgba(76,29,149,.18);
}


/* =========================
   MAIN
========================= */

.shell{
  width:92%;

  max-width:1380px;

  margin:0 auto;

  padding:34px 0 80px;
}


/* =========================
   HERO
========================= */

.hero{
  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  gap:25px;

  margin-bottom:30px;
}


.hero-copy small{
  color:#9a742d;

  text-transform:uppercase;

  letter-spacing:2px;

  font-size:11px;

  font-weight:900;
}


.hero h1{
  margin-top:8px;

  font-size:38px;

  letter-spacing:-1.5px;

  color:#211b31;
}


.hero h1 span{
  background:
    linear-gradient(
      90deg,
      #4c1d95,
      #6d28d9,
      #a67c32
    );

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;
}


.hero p{
  color:var(--muted);

  margin-top:8px;

  line-height:1.6;
}


.hero-status{
  display:flex;

  align-items:center;

  gap:8px;

  padding:11px 14px;

  border:
    1px solid
    rgba(197,155,69,.25);

  background:
    linear-gradient(
      135deg,
      #fffdf7,
      #f9f3e7
    );

  border-radius:12px;

  color:#806329;

  font-size:13px;

  font-weight:800;

  white-space:nowrap;

  box-shadow:
    0 5px 18px
    rgba(88,63,20,.06);
}


.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#22a05a;

  box-shadow:
    0 0 10px
    rgba(34,160,90,.45);
}


/* =========================
   STATS
========================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:14px;

  margin-bottom:20px;
}


.stat{
  position:relative;

  overflow:hidden;

  padding:20px;

  min-height:130px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.98),
      rgba(250,247,241,.98)
    );

  border:
    1px solid
    var(--border);

  border-radius:18px;

  box-shadow:
    var(--shadow);

  transition:.3s;
}


.stat:hover{
  transform:translateY(-4px);

  border-color:
    rgba(109,40,217,.22);

  box-shadow:
    0 20px 45px
    rgba(52,32,91,.12);
}


.stat::after{
  content:"";

  position:absolute;

  width:100px;
  height:100px;

  right:-35px;
  bottom:-45px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(109,40,217,.11),
      transparent 68%
    );

  pointer-events:none;
}


.stat-icon{
  font-size:19px;

  margin-bottom:15px;
}


.stat-value{
  font-size:30px;

  font-weight:900;

  letter-spacing:-1px;

  color:#2c2148;
}


.stat-label{
  color:#777182;

  font-size:13px;

  margin-top:4px;
}


.stat-trend{
  position:absolute;

  right:16px;
  top:18px;

  font-size:10px;

  color:#8b6a2c;

  font-weight:900;

  letter-spacing:.5px;
}


/* =========================
   MAIN GRID
========================= */

.main-grid{
  display:grid;

  grid-template-columns:
    minmax(0,2fr)
    minmax(280px,1fr);

  gap:18px;
}


.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.98),
      rgba(251,249,245,.98)
    );

  border:
    1px solid
    var(--border);

  border-radius:20px;

  padding:22px;

  margin-bottom:18px;

  box-shadow:
    var(--shadow);

  transition:.3s;
}


.card:hover{
  box-shadow:
    0 18px 45px
    rgba(51,34,82,.11);
}


.card-head{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  margin-bottom:20px;
}


.card-title{
  font-size:17px;

  font-weight:900;

  color:#251c39;
}


.card-sub{
  color:#8a8493;

  font-size:12px;

  margin-top:4px;
}


.view-link{
  text-decoration:none;

  color:#6340b5;

  font-size:12px;

  font-weight:900;
}


/* =========================
   BUSINESS
========================= */

.business-card{
  position:relative;

  overflow:hidden;
}


.business-card::before{
  content:"";

  position:absolute;

  width:300px;
  height:300px;

  top:-180px;
  right:-100px;

  background:
    radial-gradient(
      circle,
      rgba(109,40,217,.12),
      transparent 67%
    );

  pointer-events:none;
}


.business-main{
  display:flex;

  gap:17px;

  align-items:center;

  position:relative;
}


.business-avatar{
  width:78px;
  height:78px;

  flex-shrink:0;

  border-radius:20px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:28px;

  font-weight:900;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #4c1d95,
      #2563eb
    );

  box-shadow:
    0 12px 28px
    rgba(76,29,149,.2);
}


.business-name{
  font-size:24px;

  font-weight:900;

  margin-bottom:7px;

  color:#21192f;
}


.badges{
  display:flex;

  flex-wrap:wrap;

  gap:7px;
}


.badge{
  padding:5px 9px;

  border-radius:8px;

  font-size:10px;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.4px;
}


.badge-category{
  color:#5b21b6;

  background:#f2eafe;

  border:
    1px solid
    #e5d8fa;
}


.badge-active{
  color:#187743;

  background:#eefaf2;

  border:
    1px solid
    #d6f0df;
}


.business-info{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin:20px 0;
}


.info-box{
  padding:13px;

  background:
    linear-gradient(
      145deg,
      #fff,
      #faf8f3
    );

  border:
    1px solid
    #eee8dd;

  border-radius:12px;
}


.info-box small{
  display:block;

  color:#968f9d;

  font-size:10px;

  text-transform:uppercase;

  letter-spacing:.8px;

  margin-bottom:5px;
}


.info-box strong{
  font-size:13px;

  color:#40384c;

  word-break:break-word;
}


.description{
  color:#777182;

  line-height:1.65;

  font-size:13px;

  margin-bottom:18px;
}


.actions{
  display:flex;

  flex-wrap:wrap;

  gap:9px;
}


.btn{
  display:inline-flex;

  align-items:center;

  justify-content:center;

  text-decoration:none;

  border:none;

  cursor:pointer;

  padding:11px 15px;

  border-radius:11px;

  font-size:12px;

  font-weight:900;

  transition:.25s;
}


.btn-primary{
  color:#fff;

  background:
    linear-gradient(
      135deg,
      #4c1d95,
      #2563eb
    );

  box-shadow:
    0 9px 22px
    rgba(76,29,149,.18);
}


.btn-primary:hover{
  transform:translateY(-2px);

  box-shadow:
    0 13px 28px
    rgba(76,29,149,.25);
}


.btn-secondary{
  color:#5b21b6;

  background:
    linear-gradient(
      135deg,
      #f5effd,
      #edf3ff
    );

  border:
    1px solid
    #e2d8f3;
}


.btn-secondary:hover{
  transform:translateY(-2px);

  background:#eee6fa;
}


/* =========================
   ACTIVITY
========================= */

.activity{
  min-height:280px;
}


.chart{
  height:190px;

  display:flex;

  align-items:flex-end;

  gap:9px;

  padding:20px 4px 0;

  border-bottom:
    1px solid
    #eee9e1;
}


.bar-wrap{
  height:100%;

  flex:1;

  display:flex;

  align-items:flex-end;
}


.bar{
  width:100%;

  min-height:18px;

  border-radius:
    7px 7px 2px 2px;

  background:
    linear-gradient(
      180deg,
      #7c3aed,
      #2563eb
    );

  opacity:.82;

  transition:.35s;
}


.bar:hover{
  opacity:1;

  transform:scaleY(1.04);

  box-shadow:
    0 0 18px
    rgba(109,40,217,.22);
}


.labels{
  display:flex;

  gap:9px;

  margin-top:8px;
}


.labels span{
  flex:1;

  text-align:center;

  color:#918a99;

  font-size:10px;
}


/* =========================
   PROFILE SCORE
========================= */

.profile-score{
  display:flex;

  align-items:center;

  gap:15px;
}


.score-circle{
  width:72px;
  height:72px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      #fff 57%,
      transparent 58%
    ),
    conic-gradient(
      #6d28d9 0deg 302deg,
      #eee9e2 302deg
    );

  font-size:18px;

  font-weight:900;

  color:#4c1d95;

  box-shadow:
    0 5px 18px
    rgba(76,29,149,.08);
}


.score-text strong{
  display:block;

  font-size:15px;

  color:#332942;
}


.score-text span{
  color:#85808e;

  font-size:11px;
}


/* =========================
   QUICK ACTIONS
========================= */

.quick{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;
}


.quick-item{
  text-decoration:none;

  color:#433b4f;

  padding:15px 12px;

  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      #fff,
      #faf7f2
    );

  border:
    1px solid
    #eee8de;

  transition:.25s;
}


.quick-item:hover{
  transform:translateY(-3px);

  border-color:#d8c8ed;

  background:#faf6ff;

  box-shadow:
    0 10px 25px
    rgba(70,43,100,.08);
}


.quick-icon{
  font-size:19px;

  margin-bottom:9px;
}


.quick-item strong{
  display:block;

  font-size:12px;
}


.quick-item small{
  color:#918a99;

  font-size:10px;
}


/* =========================
   ACCOUNT
========================= */

.account-row{
  display:flex;

  align-items:center;

  gap:12px;

  padding:11px 0;

  border-bottom:
    1px solid
    #eee9e1;
}


.account-row:last-child{
  border-bottom:0;
}


.account-icon{
  width:32px;
  height:32px;

  border-radius:9px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #f1eafe,
      #edf3ff
    );

  color:#5b21b6;

  font-size:14px;
}


.account-row div:last-child{
  min-width:0;
}


.account-row strong{
  display:block;

  font-size:12px;

  color:#433b4f;
}


.account-row span{
  display:block;

  color:#918a99;

  font-size:10px;

  margin-top:2px;

  word-break:break-word;
}


/* =========================
   CTA
========================= */

.cta{
  position:relative;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(197,155,69,.18),
      transparent 42%
    ),

    radial-gradient(
      circle at 0% 100%,
      rgba(109,40,217,.12),
      transparent 45%
    ),

    linear-gradient(
      135deg,
      #fbf7ff,
      #f4f1ff
    );

  border-color:#e4d8f2;
}


.cta h2{
  font-size:19px;

  margin-bottom:7px;

  color:#332044;
}


.cta p{
  color:#777182;

  font-size:12px;

  line-height:1.6;

  margin-bottom:17px;
}


/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;

  padding:28px 10px;
}


.empty-icon{
  font-size:34px;

  margin-bottom:10px;
}


.empty h3{
  font-size:16px;

  margin-bottom:6px;

  color:#342a40;
}


.empty p{
  color:#817b89;

  font-size:12px;

  line-height:1.6;
}


/* =========================
   LOADING
========================= */

.loading{
  color:#817b89;

  padding:25px 0;

  font-size:13px;
}


.error{
  color:#c62828;
}


/* =========================
   FOOTER
========================= */

footer{
  text-align:center;

  color:#9a94a1;

  font-size:10px;

  padding:20px;
}


/* =========================
   MOBILE NAV
========================= */

.mobile-nav{
  display:none;
}


/* =========================
   ANIMATION
========================= */

@keyframes royalFade{

  from{
    opacity:0;

    transform:
      translateY(12px);
  }

  to{
    opacity:1;

    transform:
      translateY(0);
  }

}


.hero,
.stat,
.card{
  animation:
    royalFade .55s ease both;
}


.stat:nth-child(2){
  animation-delay:.06s;
}


.stat:nth-child(3){
  animation-delay:.12s;
}


.stat:nth-child(4){
  animation-delay:.18s;
}


/* =========================
   TABLET
========================= */

@media(max-width:950px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .main-grid{
    grid-template-columns:1fr;
  }

}


/* =========================
   MOBILE
========================= */

  body{
    padding-bottom:65px;
  }

  }

  .logo-mark{
    width:32px;
    height:32px;

    border-radius:9px;

    display:none;
  }

    border-radius:17px;

    margin-bottom:13px;
  }

  }
