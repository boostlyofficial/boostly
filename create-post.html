<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Boost Post | Boostly</title>

<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f5fb;
  color:#17131f;
}

.header{
  background:#fff;
  border-bottom:1px solid #eee8f5;
  padding:15px 20px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  text-decoration:none;
  font-size:24px;
  font-weight:800;
  color:#6d3df5;
}

.back{
  text-decoration:none;
  color:#555;
  font-size:14px;
  font-weight:600;
}

.container{
  max-width:850px;
  margin:30px auto;
  padding:0 16px;
}

.title{
  text-align:center;
  margin-bottom:25px;
}

.title h1{
  font-size:30px;
  margin-bottom:8px;
}

.title p{
  color:#777;
  font-size:15px;
}

.card{
  background:#fff;
  border:1px solid #ebe5f2;
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(40,20,70,.06);
}

.card h2{
  font-size:19px;
  margin-bottom:17px;
}

.type-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.type-btn{
  border:1px solid #ddd5eb;
  background:#fff;
  border-radius:14px;
  padding:17px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
}

.type-btn.active{
  border:2px solid #6d3df5;
  background:#f4efff;
  color:#6d3df5;
}

.upload-btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  background:#6d3df5;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.upload-btn:disabled{
  opacity:.6;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
}

.field textarea,
.field input{
  width:100%;
  border:1px solid #ddd6e8;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  outline:none;
  font-family:inherit;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.counter{
  text-align:right;
  color:#888;
  font-size:12px;
  margin-top:5px;
}

.publish-btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  background:#6d3df5;
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.publish-btn:disabled{
  opacity:.6;
}

.status{
  display:none;
  padding:14px;
  border-radius:12px;
  margin-bottom:18px;
  font-size:14px;
  font-weight:600;
}

.status.info{
  display:block;
  background:#f0ebff;
  color:#5732bb;
}

.status.success{
  display:block;
  background:#eaf9ef;
  color:#18743a;
}

.status.error{
  display:block;
  background:#fff0f0;
  color:#b42323;
}

.preview{
  display:none;
  margin-top:18px;
}

.preview img,
.preview video{
  width:100%;
  max-height:400px;
  object-fit:contain;
  border-radius:14px;
  background:#111;
}

.note{
  background:#f6f2ff;
  border-radius:12px;
  padding:13px;
  color:#5d4a78;
  font-size:13px;
  line-height:1.5;
  margin-top:15px;
}

@media(max-width:600px){

  .title h1{
    font-size:25px;
  }

  .card{
    padding:17px;
    border-radius:16px;
  }

}

</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <a href="index.html" class="logo">
      Boostly
    </a>

    <a href="dashboard.html" class="back">
      ← Dashboard
    </a>

  </div>

</header>


<main class="container">

  <div class="title">

    <h1>Create Boost Post</h1>

    <p>
      Create and publish content for your Boostly business profile.
    </p>

  </div>


  <div id="status" class="status"></div>


  <!-- POST TYPE -->

  <section class="card">

    <h2>1. Choose Post Type</h2>

    <div class="type-buttons">

      <button
        type="button"
        class="type-btn active"
        data-type="post">

        📸 Boost Post

      </button>

      <button
        type="button"
        class="type-btn"
        data-type="reel">

        🎬 Boost Reel

      </button>

    </div>

  </section>


  <!-- MEDIA -->

  <section class="card">

    <h2>2. Add Photo or Video</h2>

    <button
      type="button"
      id="uploadBtn"
      class="upload-btn">

      ☁️ Select Photo or Video

    </button>

    <div id="preview" class="preview"></div>

    <div class="note">
      Your selected photo or video will be securely uploaded
      to Cloudinary before publishing.
    </div>

  </section>


  <!-- DETAILS -->

  <section class="card">

    <h2>3. Post Details</h2>

    <div class="field">

      <label for="caption">
        Caption
      </label>

      <textarea
        id="caption"
        maxlength="2200"
        placeholder="Write something about your business, product or offer..."></textarea>

      <div class="counter">
        <span id="captionCount">0</span>/2200
      </div>

    </div>


    <div class="field">

      <label for="location">
        Location
      </label>

      <input
        type="text"
        id="location"
        maxlength="200"
        placeholder="Example: Ludhiana, Punjab">

    </div>


    <div class="field">

      <label for="hashtags">
        Hashtags
      </label>

      <input
        type="text"
        id="hashtags"
        maxlength="500"
        placeholder="#Boostly #Business #Ludhiana">

    </div>

  </section>


  <!-- PUBLISH -->

  <section class="card">

    <h2>4. Publish</h2>

    <button
      type="button"
      class="publish-btn"
      id="publishBtn">

      🚀 Publish Boost Post

    </button>

  </section>

</main>


<script>

let business = null;
let selectedPostType = "post";
let uploadedMedia = null;
let widget = null;


/* =====================================================
   ELEMENTS
===================================================== */

const statusBox =
  document.getElementById("status");

const uploadBtn =
  document.getElementById("uploadBtn");

const publishBtn =
  document.getElementById("publishBtn");

const preview =
  document.getElementById("preview");

const caption =
  document.getElementById("caption");

const locationInput =
  document.getElementById("location");

const hashtags =
  document.getElementById("hashtags");

const captionCount =
  document.getElementById("captionCount");


/* =====================================================
   STATUS
===================================================== */

function showStatus(message,type){

  statusBox.className =
    "status " + type;

  statusBox.textContent =
    message;

}


/* =====================================================
   POST TYPE
===================================================== */

document
.querySelectorAll(".type-btn")
.forEach(button => {

  button.addEventListener("click", () => {

    document
    .querySelectorAll(".type-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");

    selectedPostType =
      button.dataset.type;

    uploadedMedia = null;

    preview.style.display =
      "none";

    preview.innerHTML = "";

  });

});


/* =====================================================
   CAPTION COUNTER
===================================================== */

caption.addEventListener("input", () => {

  captionCount.textContent =
    caption.value.length;

});


/* =====================================================
   LOAD BUSINESS
===================================================== */

async function loadBusiness(){

  const response =
    await fetch(
      "/api/my-business",
      {
        credentials:"include"
      }
    );

  const text =
    await response.text();

  if(!response.ok){

    throw new Error(
      "Business profile error " +
      response.status
    );

  }

  business =
    JSON.parse(text);

  if(!business.id){

    throw new Error(
      "Business profile ID nahi mila."
    );

  }

}


/* =====================================================
   CLOUDINARY WIDGET
===================================================== */

function createWidget(){

  widget =
    cloudinary.createUploadWidget(

      {

        cloudName:"zszjccck",

        uploadPreset:"boostly_upload",

        sources:[
          "local"
        ],

        multiple:false,

        resourceType:"auto",

        maxFileSize:52428800,

        clientAllowedFormats:[
          "jpg",
          "jpeg",
          "png",
          "webp",
          "mp4",
          "mov",
          "webm"
        ],

        folder:"boostly",

        cropping:false,

        showAdvancedOptions:false,

        showSkipCropButton:false

      },

      async function(error,result){

        if(error){

          console.error(error);

          uploadBtn.disabled =
            false;

          uploadBtn.textContent =
            "☁️ Select Photo or Video";

          showStatus(
            "Cloudinary upload error: " +
            (
              error.message ||
              "Upload failed"
            ),
            "error"
          );

          return;

        }


        if(
          result &&
          result.event === "upload-added"
        ){

          showStatus(
            "☁️ Uploading media to Cloudinary...",
            "info"
          );

        }


        if(
          result &&
          result.event === "success"
        ){

          const info =
            result.info;

          /* REEL MUST BE VIDEO */

          if(
            selectedPostType === "reel" &&
            info.resource_type !== "video"
          ){

            uploadedMedia = null;

            showStatus(
              "Boost Reel ke liye video select karo.",
              "error"
            );

            uploadBtn.disabled =
              false;

            uploadBtn.textContent =
              "☁️ Select Photo or Video";

            return;

          }


          uploadedMedia = info;


          if(
            info.resource_type === "video"
          ){

            preview.innerHTML =
              "<video controls src=\"" +
              info.secure_url +
              "\"></video>";

          }else{

            preview.innerHTML =
              "<img src=\"" +
              info.secure_url +
              "\" alt=\"Boostly post\">";

          }

          preview.style.display =
            "block";


          uploadBtn.disabled =
            false;

          uploadBtn.textContent =
            "✅ Media Selected";


          showStatus(
            "Media upload successful. Ab Publish par tap karo.",
            "success"
          );

        }

      }

    );

}


/* =====================================================
   OPEN CLOUDINARY
===================================================== */

uploadBtn.addEventListener(
  "click",
  async function(){

    try{

      uploadBtn.disabled =
        true;

      uploadBtn.textContent =
        "Opening uploader...";


      showStatus(
        "Business profile check ho raha hai...",
        "info"
      );


      await loadBusiness();


      if(!widget){

        createWidget();

      }


      uploadBtn.disabled =
        false;

      widget.open();


    }catch(error){

      console.error(error);

      uploadBtn.disabled =
        false;

      uploadBtn.textContent =
        "☁️ Select Photo or Video";

      showStatus(
        "❌ " + error.message,
        "error"
      );

    }

  }
);


/* =====================================================
   PUBLISH BOOST POST
===================================================== */

publishBtn.addEventListener(
  "click",
  async function(){

    try{

      if(!business){

        await loadBusiness();

      }


      if(!uploadedMedia){

        showStatus(
          "Please pehle photo ya video select karo.",
          "error"
        );

        return;

      }


      if(
        selectedPostType === "reel" &&
        uploadedMedia.resource_type !== "video"
      ){

        showStatus(
          "Boost Reel ke liye video required hai.",
          "error"
        );

        return;

      }


      publishBtn.disabled =
        true;

      publishBtn.textContent =
        "Publishing...";


      showStatus(
        "🚀 Boost Post publish ho raha hai...",
        "info"
      );


      const form =
        new FormData();


      form.append(
        "business_id",
        String(business.id)
      );


      form.append(
        "post_type",
        selectedPostType
      );


      form.append(
        "media_type",
        uploadedMedia.resource_type === "video"
          ? "video"
          : "image"
      );


      form.append(
        "media_url",
        uploadedMedia.secure_url
      );


      form.append(
        "thumbnail_url",
        uploadedMedia.thumbnail_url || ""
      );


      form.append(
        "public_id",
        uploadedMedia.public_id || ""
      );


      form.append(
        "caption",
        caption.value.trim()
      );


      form.append(
        "location",
        locationInput.value.trim()
      );


      form.append(
        "hashtags",
        hashtags.value.trim()
      );


      const response =
        await fetch(
          "/api/boost-post",
          {
            method:"POST",
            credentials:"include",
            body:form
          }
        );


      const text =
        await response.text();


      let data = {};

      try{

        data =
          JSON.parse(text);

      }catch{

        throw new Error(
          "Invalid server response"
        );

      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "Boost Post publish failed"
        );

      }


      if(data.success !== true){

        throw new Error(
          data.error ||
          "Boost Post publish failed"
        );

      }


      showStatus(
        "🎉 Boost Post successfully published! Post ID: " +
        data.post_id,
        "success"
      );


      publishBtn.textContent =
        "✅ Published";


      caption.value = "";
      locationInput.value = "";
      hashtags.value = "";

      captionCount.textContent =
        "0";

      uploadedMedia = null;


    }catch(error){

      console.error(error);

      publishBtn.disabled =
        false;

      publishBtn.textContent =
        "🚀 Publish Boost Post";

      showStatus(
        "❌ " + error.message,
        "error"
      );

    }

  }
);

</script>

</body>
</html>
