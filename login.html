<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login – Boostly</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#f5f4ff,#eef2ff);
  color:#171827;
}

a{
  text-decoration:none;
}

.header{
  height:72px;
  background:white;
  border-bottom:1px solid #e8e8ef;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:#5b50e6;
}

.home-link{
  color:#55576b;
  font-size:14px;
  font-weight:700;
}

.home-link:hover{
  color:#5b50e6;
}

.wrapper{
  min-height:calc(100vh - 72px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:35px 20px;
}

.login-card{
  width:100%;
  max-width:450px;
  background:white;
  padding:38px;
  border-radius:22px;
  box-shadow:0 18px 50px rgba(30,30,80,.12);
  border:1px solid #e8e8f0;
}

.icon{
  width:58px;
  height:58px;
  margin:0 auto 18px;
  border-radius:16px;
  background:#f0efff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

h1{
  text-align:center;
  font-size:30px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#747688;
  font-size:14px;
  margin-bottom:28px;
}

label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.input-group{
  margin-bottom:18px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #dfe0e9;
  border-radius:10px;
  font-size:14px;
  outline:none;
}

input:focus{
  border-color:#5b50e6;
  box-shadow:0 0 0 3px rgba(91,80,230,.08);
}

.password-row{
  position:relative;
}

.password-row input{
  padding-right:75px;
}

.show-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#5b50e6;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:3px 0 22px;
  font-size:12px;
}

.remember{
  display:flex;
  align-items:center;
  gap:7px;
  color:#666879;
}

.remember input{
  width:auto;
}

.forgot{
  color:#5b50e6;
  font-weight:800;
}

.login-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#5b50e6;
  color:white;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.login-btn:hover{
  background:#4d43d5;
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:25px 0;
  color:#999baa;
  font-size:12px;
}

.divider::before,
.divider::after{
  content:"";
  height:1px;
  background:#e5e5ed;
  flex:1;
}

.signup{
  text-align:center;
  color:#686a7a;
  font-size:13px;
}

.signup a{
  color:#5b50e6;
  font-weight:900;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  background:#f0efff;
  color:#4d43d5;
  text-align:center;
  font-size:13px;
  font-weight:700;
}

@media(max-width:500px){

  .header{
    padding:0 20px;
  }

  .login-card{
    padding:28px 20px;
    border-radius:18px;
  }

  h1{
    font-size:26px;
  }

  .wrapper{
    padding:25px 15px;
  }

}
</style>
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">
    Boostly
  </a>

  <a href="index.html" class="home-link">
    ← Back to Home
  </a>

</header>

<main class="wrapper">

  <section class="login-card">

    <div class="icon">🔐</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to your Boostly account
    </p>

    <form action="/api/login" method="POST">

  <label for="email">Email Address</label>

  <input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your email"
    required
  >

  <label for="password">Password</label>

  <input
    type="password"
    id="password"
    name="password"
    placeholder="Enter your password"
    required
  >

  <label class="checkbox-row">
    <input type="checkbox" name="remember">
    <span>Remember me</span>
  </label>

  <button type="submit">
    Login to Boostly
  </button>

</form>

    <div class="message" id="message">
      Demo login submitted. Real authentication will be connected later.
    </div>

    <div class="divider">
      OR
    </div>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Create Account</a>
    </div>

  </section>

</main>

<script>

function togglePassword(){

  const password =
    document.getElementById("password");

  const button =
    document.querySelector(".show-password");

  if(password.type === "password"){

    password.type = "text";
    button.textContent = "Hide";

  }else{

    password.type = "password";
    button.textContent = "Show";

  }

}



  

  



</script>

</body>
</html>
